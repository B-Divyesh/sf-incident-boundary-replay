[package]
name = "boundary-replay"
version = "0.1.0"
edition = "2021"
description = "Capture scrubbed HTTP exchanges and replay them as local mock fixtures"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-incident-boundary-replay"
readme = "README.md"
keywords = ["http", "webhook", "mock", "redaction", "debugging"]
categories = ["command-line-utilities", "development-tools::testing"]
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]

[[bin]]
name = "boundary-replay"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
http = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.21"


<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-labelledby="title desc">
  <title id="title">Boundary Replay demo terminal recording</title>
  <desc id="desc">A captured transcript from the shipped Boundary Replay demo command.</desc>
  <style>
    text{font-family:ui-monospace,monospace;font-size:15px;fill:#aec4c6}.prompt{fill:#5eead4}.amber{fill:#ffc66d}.green{fill:#8de5af}
    .cursor{animation:blink 1s step-end 3}@keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.cursor{animation:none}}
  </style>
  <rect width="960" height="230" fill="#050b11"/><path d="M0 42h960" stroke="#315062"/>
  <circle cx="20" cy="21" r="4" fill="none" stroke="#315062"/><circle cx="36" cy="21" r="4" fill="none" stroke="#315062"/><circle cx="52" cy="21" r="4" fill="none" stroke="#315062"/>
  <text x="76" y="27">boundary-replay demo</text>
  <text class="prompt" x="20" y="70">$ boundary-replay demo</text>
  <g id="demo-output">
    <text x="20" y="98">Demo — isolated sample data; no existing captures were read or changed.</text>
    <text class="amber" x="20" y="126">Scrubbed four secret or personal-data fields before disk.</text>
    <text x="20" y="154">Bundle: /tmp/boundary-replay-demo-0ad0e8a4/payment-failure.bundle</text>
    <text class="green" x="20" y="182">Run: boundary-replay serve --bundle /tmp/boundary-replay-demo-0ad0e8a4/payment-failure.bundle --listen 127.0.0.1:9487</text>
  </g>
  <rect class="cursor" x="880" y="168" width="8" height="18" fill="#5eead4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-labelledby="title desc">
  <title id="title">Boundary Replay demo terminal recording</title>
  <desc id="desc">The demo command captures a failed webhook, replaces four values, and exports one local fixture.</desc>
  <style>
    text{font-family:ui-monospace,monospace;font-size:15px;fill:#aec4c6}.prompt{fill:#5eead4}.amber{fill:#ffc66d}.green{fill:#8de5af}
    .cursor{animation:blink 1s step-end 3}@keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.cursor{animation:none}}
  </style>
  <rect width="960" height="180" fill="#050b11"/><path d="M0 42h960" stroke="#315062"/>
  <circle cx="20" cy="21" r="4" fill="none" stroke="#315062"/><circle cx="36" cy="21" r="4" fill="none" stroke="#315062"/><circle cx="52" cy="21" r="4" fill="none" stroke="#315062"/>
  <text x="76" y="27">boundary-replay demo — recorded locally</text>
  <text class="prompt" x="20" y="70">$ boundary-replay demo</text>
  <text x="20" y="98">Captured POST /webhooks/payment · trace 7ef92c1b45d04da6</text>
  <text class="amber" x="20" y="126">Scrubbed 4 values before disk</text>
  <text class="green" x="20" y="154">Exported 1 fixture · local mock ready on 127.0.0.1</text>
  <rect class="cursor" x="560" y="140" width="8" height="18" fill="#5eead4"/>
</svg>
